name: Build MAGMA SMP WASM-GC Client

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build WASM-GC client
        run: bash ./gradlew makeMainWasmClientBundle --no-daemon

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: MAGMA-SMP-WASM-GC
          path: target_teavm_wasm_gc/javascript_dist/
          if-no-files-found: error


name: Build MAGMA SMP WASM-GC Client

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Discover available build tasks
        run: |
          bash ./gradlew tasks --all --no-daemon | tee gradle-tasks.txt
          echo ""
          echo "===== WASM / CLIENT / BUNDLE TASKS ====="
          grep -i -E 'wasm|bundle|client|javascript' gradle-tasks.txt || true

      - name: Build WASM-GC client
        run: |
          TASK=$(grep -i -E 'makeMainWasmClientBundle|wasm.*bundle|bundle.*wasm' gradle-tasks.txt | head -n 1 | awk '{print $1}')

          if [ -z "$TASK" ]; then
            echo "No matching WASM bundle task was found."
            echo "Check the Discover available build tasks step."
            exit 1
          fi

          echo "Running Gradle task: $TASK"
          bash ./gradlew "$TASK" --no-daemon

      - name: Upload browser build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAGMA-SMP-WASM-GC
          path: target_teavm_wasm_gc/javascript_dist/
          if-no-files-found: error
